admin_index:
  path: /admin
  controller: App\Admin\Controller\AdminController::index

admin_dashboard:
  path: /admin/dashboard
  controller: App\Admin\Controller\AdminController::dashboard


admin_json_write_set_scheme:
  path: /admin/json-write/set-scheme
  controller: App\Admin\Controller\AdminWriteController::setScheme
  methods: [POST]

# User
admin_user_index:
  path: /admin/uzivatele
  controller: App\User\Controller\Admin\UserListController::index

admin_user_list:
  path: /admin/uzivatele/seznam
  controller: App\User\Controller\Admin\UserListController::list

admin_user_get_list:
  path: /admin/uzivatele/json-list/get-list
  controller: App\User\Controller\Admin\UserListController::getList
  methods: [GET]

admin_user_get_user:
  path: /admin/uzivatele/json-list/get-user
  controller: App\User\Controller\Admin\UserListController::getUser
  methods: [POST]

admin_user_add:
  path: /admin/uzivatele/pridat
  controller: App\User\Controller\Admin\UserWriteController::add

admin_user_edit:
  path: /admin/uzivatele/upravit/{id}
  controller: App\User\Controller\Admin\UserWriteController::edit
  requirements:
    id: '\d+'

admin_user_delete:
  path: /admin/uzivatele/json-write/smazat-uzivatele
  controller: App\User\Controller\Admin\UserWriteController::deleteUser
  methods: [POST]

admin_user_upload_image:
  path: /admin/uzivatele/json-write/nahrat-obrazek
  controller: App\User\Controller\Admin\UserWriteController::uploadImage
  methods: [POST]

# Job
admin_job_index:
  path: /admin/prace
  controller: App\Job\Controller\Admin\JobListController::index

admin_job_list:
  path: /admin/prace/list
  controller: App\Job\Controller\Admin\JobListController::list

admin_job_json_list:
  path: /admin/prace/json-list/get-list
  controller: App\Job\Controller\Admin\JobListController::getList
  methods: [GET]

admin_job_json_list_ours:
  path: /admin/prace/json-list/get-list-ours
  controller: App\Job\Controller\Admin\JobListController::getListOurs
  methods: [GET]

admin_job_setting:
  path: /admin/prace/nastaveni
  controller: App\Job\Controller\Admin\SettingController::index

admin_job_setting_write:
  path: /admin/prace/nastaveni/ulozit
  controller: App\Job\Controller\Admin\SettingController::setting
  methods: [POST]
