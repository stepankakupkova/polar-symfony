# Web — Volby 2026
election_2026:
  path: /volby
  controller: App\Election\Controller\Web\Web2026Controller::index

election_2026_kandidati:
  path: /volby/kandidati/okres/{okres}
  controller: App\Election\Controller\Web\Web2026Controller::kandidati
  defaults:
    obec: null
  requirements:
    okres: '[0-9]+'

election_2026_kandidati_obec:
  path: /volby/kandidati/okres/{okres}/obec/{obec}
  controller: App\Election\Controller\Web\Web2026Controller::kandidati
  requirements:
    okres: '[0-9]+'
    obec: '[0-9]+'

election_2026_obec:
  path: /volby/okres/{okres}
  controller: App\Election\Controller\Web\Web2026Controller::obec
  defaults:
    obec: null
  requirements:
    okres: '[0-9]+'

election_2026_obec_detail:
  path: /volby/okres/{okres}/obec/{obec}
  controller: App\Election\Controller\Web\Web2026Controller::obec
  requirements:
    okres: '[0-9]+'
    obec: '[0-9]+'

