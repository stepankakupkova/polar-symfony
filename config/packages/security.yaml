security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: /admin
                enable_csrf: true
            logout:
                path: app_logout
                target: /autorizace/odhlasit

    # Polar ACL ekvivalent:
    # owner/admin → přístup do /admin
    # guest → pouze veřejné stránky + přihlášení
    access_control:
        - { path: ^/prihlaseni, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: [ROLE_OWNER, ROLE_ADMIN] }

    role_hierarchy:
        ROLE_OWNER: [ROLE_ADMIN, ROLE_MEMBER]
        ROLE_ADMIN: [ROLE_MEMBER]

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
